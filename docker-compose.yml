# HellGate — TCP + in-tunnel UDP on **9443** (Demonica UDP flavor, etc.).
# A separate **8443** legacy relay, if you run one, is outside this compose file.
#
#   mkdir -p config
#   cp server_config.example.json config/server_config.json
#   # openssl rand -hex 32 → tunnel_key; keep upstream_proxy empty for UDP egress
#   docker compose up -d --build
#   curl -sS http://127.0.0.1:9443/healthz
#
# Apps Script for this relay: RELAY_URL = http://YOUR_HOST:9443/tunnel

services:
  hellgate:
    build:
      context: .
      dockerfile: Dockerfile
    image: hellgate-server:latest
    container_name: hellgate
    restart: unless-stopped
    ports:
      - "9443:9443"
    volumes:
      - ./config/server_config.json:/app/server_config.json:ro
